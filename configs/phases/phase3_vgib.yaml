defaults:
  - ../base

phase: 3
name: vgib_subgraph_selection

vgib:
  objective: "min -I(G_Z; Y) + beta * I(G_Z; G)"
  selector:
    architecture: graphsage
    layers: 3
    task_conditioning: concat_to_node_features
    task_embedding: voyage_code_3
  selection:
    method: gumbel_softmax
    temperature_start: 1.0
    temperature_end: 0.1
    anneal_schedule: linear
  loss:
    prediction: cross_entropy
    compression: noise_penalty
  beta_sweep: [0.001, 0.01, 0.1, 1.0]

data_split:
  train_tasks: 35
  test_tasks: 15

comparison_strategies:
  random_k:
    type: negative_control
    description: "k random entities from the graph"
  bfs_k:
    type: heuristic_baseline
    max_hops: 2
  ppr_k:
    type: heuristic_baseline
    alpha: 0.15
  embedding_knn:
    type: dense_baseline
    model: voyage-code-3
  vgib_k:
    type: proposed
    description: "k entities by VGIB retention probability"

k_sweep: [10, 20, 50, 100, 200]

key_deliverable:
  name: pareto_frontier_plot
  x_axis: retrieved_tokens
  y_axis: pass_at_1
  description: "Each strategy traces a curve as k varies. VGIB should dominate."

kill_criterion:
  condition: "VGIB does not dominate Pareto frontier over PPR-k for any beta"
  action: "Simplify retrieval to PPR + entity-type filtering, skip to Phase 5"
